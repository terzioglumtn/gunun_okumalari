name: Günlük sayı

on:
  schedule:
    # 03:23 UTC = 06:23 İstanbul (UTC+3, yaz saati yok).
    # Actions zamanlayıcısı best-effort: tam saat başlarında (dakika 0) çalıştırmaları geciktirir/atlar,
    # bu yüzden dakika 23 seçildi ve sayfanın 08:00'de hazır olması için 1,5 saatlik pay bırakıldı.
    - cron: "23 3 * * *"
    # Yedek tetikleyiciler: ilki atlanırsa devreye girer. Bugünün sayısı varsa "Bugünün sayısı var mı?" adımı hepsini atlar.
    - cron: "47 4 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      render_only:
        description: "Yalnızca siteyi mevcut veriden yeniden üret (LLM çalışmaz, limit harcanmaz)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Zamanlanmış çalışma bugünün sayısı zaten üretildiyse (yedek tetikleyiciler) hiçbir şey yapmaz.
      # Elle başlatılan (workflow_dispatch) çalışmalar her zaman yeniden üretir.
      - name: Bugünün sayısı var mı?
        id: guard
        run: |
          today=$(TZ=Europe/Istanbul date +%F)
          if [ "${{ inputs.render_only }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Yalnızca site yeniden üretilecek."
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$today.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "data/$today.json zaten var; atlanıyor."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: pip install -r requirements.txt

      # Varsayılan backend: Claude Code CLI (abonelik token'ı).
      # API'ye geçmek için: Settings > Variables > LLM_BACKEND = anthropic_api
      # Sınama için: LLM_BACKEND = mock
      - name: Node (claude_cli için)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.render != 'true' && (vars.LLM_BACKEND != 'anthropic_api' && vars.LLM_BACKEND != 'mock') }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Claude Code CLI
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.render != 'true' && (vars.LLM_BACKEND != 'anthropic_api' && vars.LLM_BACKEND != 'mock') }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Sayıyı üret (API)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.render != 'true' && (vars.LLM_BACKEND == 'anthropic_api') }}
        env:
          LLM_BACKEND: anthropic_api
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.run

      # Bu adımda ANTHROPIC_API_KEY bilerek tanımlı değil: tanımlı olsaydı CLI aboneliğiniz yerine API anahtarını kullanırdı.
      - name: Sayıyı üret (abonelik veya mock)
        if: ${{ steps.guard.outputs.skip != 'true' && steps.guard.outputs.render != 'true' && (vars.LLM_BACKEND != 'anthropic_api') }}
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m src.run

      - name: Siteyi yeniden üret (LLM yok)
        if: ${{ steps.guard.outputs.render == 'true' }}
        run: python -m src.render

      - name: Veriyi depoya işle
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Sayı: $(date -u +%F)"
            # Çalışma sırasında main'e başka push geldiyse yeniden dene (aynı gün yeniden çalışırsa bu çalışmanın data/ dosyası kazanır)
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - uses: actions/configure-pages@v5
        if: ${{ steps.guard.outputs.skip != 'true' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          path: site
      - id: deployment
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/deploy-pages@v4
