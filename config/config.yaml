# Günün Okumaları — yapılandırma
# Akışları eklemek/çıkarmak için yalnızca bu dosyayı düzenleyin.

site:
  title: "Günün Okumaları"
  subtitle: "Her sabah, seçilmiş kaynaklardan Türkçe okuma listesi"
  base_url: "https://terzioglumtn.github.io/gunun_okumalari/"
  timezone: "Europe/Istanbul"

run:
  lookback_hours: 48        # kaçırılan bir gün olursa öğe kaybolmasın diye geniş tutulur
  seen_days: 7              # son 7 günde yayınlanan bağlantılar tekrar seçilmez (kaynak başına seen_days ile değiştirilebilir)
  seen_days_max: 30         # geçmiş taraması: en uzun seen_days bunu aşamaz
  per_feed_cap: 20          # bir akıştan en fazla bu kadar yeni öğe adaya girer
  candidates_per_topic: 160 # LLM'e giden aday üst sınırı (maliyeti sınırlar)
  top_n: 3                  # "Önce bunlar" bölümü (minimum sürüm)
  max_medium: 3             # Medium (kind: medium) türünden en fazla kaç madde
  max_qa: 3                 # soru-cevap (Stack Overflow) türünden en fazla kaç madde
  max_feed_failure_ratio: 0.5   # akışların yarısından fazlası okunamazsa iş başarısız olur (uyarı e-postası)

llm:
  # backend: ortam değişkeni LLM_BACKEND ile de verilebilir.
  #   claude_cli    -> Claude Code, abonelik token'ı (CLAUDE_CODE_OAUTH_TOKEN)
  #   anthropic_api -> Anthropic API (ANTHROPIC_API_KEY)
  #   mock          -> LLM çağırmaz, hattı ücretsiz sınamak içindir
  backend: claude_cli
  select_model: claude-haiku-5-5      # eleme aşaması: ucuz model yeterli
  summarize_model: claude-sonnet-5-5  # özetleme aşaması

topics:
  dotnet:
    title: "Yazılım"
    tags:   # her maddeye bunlardan 1-2 etiket verilir (LLM), uymazsa "Diğer"
      - Web and Cloud Development
      - Windows Development
      - ".NET and Visual Studio"
      - AI
      - Python
      - "Design, DevOps and Methodology"
      - Mobile and Game Development
      - Screencasts and Videos
    repo_slots: 1   # GitHub Trending (haftalık) listesinden her gün 1 depo ZORUNLU seçilir (makale kontenjanına ek)
    desc: "Yazılım geliştirme: .NET, C#, WPF/WinForms, Avalonia, Visual Studio, web ve bulut, Python, mobil ve oyun, DevOps ve metodoloji, yazılım mimarisi, Git, geliştirici araçları ve yapay zekâ destekli geliştirme"
    max_items: 10
  teknoloji:
    title: "Teknoloji ve Yapay Zeka"
    desc: "Yapay zekâ modelleri ve sektörü, yarı iletken ve YZ altyapısı, teknolojinin toplum ve politika boyutu; uygulamalı yazılım mühendisliği bu alana değil Yazılım'a girer"
    max_items: 5
  savunma:
    title: "Savunma"
    desc: "İHA/SİHA, insansız sistemler, otonomi, İHA karşıtı sistemler, savunma sanayii programları ve ihracat gelişmeleri"
    max_items: 10
  jeopolitik:
    title: "Jeopolitik ve Strateji"
    desc: "Bölgesel güvenlik, deniz stratejisi, Orta Doğu, enerji güvenliği, büyük güç rekabeti ve uluslararası ilişkiler; platform ve sanayi haberleri Savunma'ya girer"
    max_items: 3
  liderlik:
    title: "İş ve Liderlik"
    desc: "Liderlik, ekip yönetimi, strateji, kurumsal kültür, karar verme, girişimcilik ve inovasyon yönetimi; somut örnek, araştırma veya uygulanabilir çerçeve içeren yazılar"
    max_items: 1
  ekonomi:
    title: "Ekonomi"
    desc: "Makroekonomi, küresel ve Türkiye ekonomisi, veriye dayalı ekonomik analiz"
    max_items: 2
feeds:
  # --- Substack (RSS: <yayın>/feed). Haftalık yayınlar: 7 günlük pencere (lookback_hours: 168). Ücretli ağırlıklı olanlar kind: preview (ön izlemeye dayalı kısa özet) ---
  - {name: "ByteByteGo", lookback_hours: 168, topic: dotnet, url: "https://blog.bytebytego.com/feed"}
  - {name: "SemiAnalysis", lookback_hours: 168, topic: teknoloji, kind: preview, url: "https://newsletter.semianalysis.com/feed"}
  # --- Türkçe teknoloji haberleri (Inoreader): yüksek hacim, aday sınırı düşük ---
  - {name: "Webrazzi", topic: teknoloji, cap: 6, url: "https://feeds.feedburner.com/webrazzi"}
  - {name: "LOG", topic: teknoloji, cap: 5, url: "https://www.log.com.tr/feed/"}
  - {name: "Hardware Plus", topic: teknoloji, cap: 5, url: "https://hwp.com.tr/feed"}
  - {name: "Webtekno", topic: teknoloji, cap: 5, url: "https://www.webtekno.com/rss.xml"}
  - {name: "The Economist: Science and technology", topic: teknoloji, kind: preview, cap: 5, url: "https://www.economist.com/science-and-technology/rss.xml"}
  - {name: "Yapay Bülten", lookback_hours: 168, topic: teknoloji, url: "https://bulten.yapaybulten.com/feed"}
  - {name: "Anafikir", lookback_hours: 168, topic: teknoloji, url: "https://anafikir.substack.com/feed"}
  - {name: "Dünya Trendleri", lookback_hours: 168, topic: teknoloji, url: "https://dunyatrendleri.substack.com/feed"}
  - {name: "Cem Gürdeniz", lookback_hours: 168, topic: jeopolitik, url: "https://cemgurdenz.substack.com/feed"}
  - {name: "Middle East Politics", lookback_hours: 168, topic: jeopolitik, url: "https://mideastpolitics.substack.com/feed"}
  - {name: "M. Serdar Kuzuloğlu Bülteni", lookback_hours: 168, topic: jeopolitik, url: "https://bulten.mserdark.com/feed"}
  - {name: "The Economist: Off the Charts", lookback_hours: 168, topic: ekonomi, kind: preview, url: "https://theeconomistoffthecharts.substack.com/feed"}
  # Küme Vakfı: RSS yok, Substack pasif -> arşiv sayfası ayrıştırılır. Yayınlar başlık/türe göre alana dağıtılır.
  - name: "Küme Vakfı"
    topic: teknoloji
    html: kume
    lookback_hours: 168
    url: "https://kumevakfi.org/yayinlar"
    cap: 6
    types: [Blog, Bülten, Rapor]   # Dosya, sanat, etkinlik, duyuru alınmaz
    routes:                        # alan, kartın program etiketine göre
      - {program: "Güvenlik ve Strateji", topic: jeopolitik}
      - {program: "Teknoloji ve Yapay Zeka", topic: teknoloji}
      - {topic: null}              # diğer programlar (ODAK, ArtıKÜME vb.) alınmaz

  # --- İş ve liderlik (günde 1 madde) ---
  # Inc. Türkiye (abonelikli): RSS adresi sayfa kaynağından bulundu; ön izlemeye dayalı kısa özet (kind: preview).
  - {name: "Inc. Türkiye", topic: liderlik, kind: preview, url: "https://incturkiye.com/story-feeds"}
  - {name: "Harvard Business Review", topic: liderlik, enabled: false, url: "https://feeds.hbr.org/harvardbusiness"}
  - {name: "MIT Sloan Management Review", topic: liderlik, enabled: false, url: "https://sloanreview.mit.edu/feed/"}
  - {name: "Inc.", topic: liderlik, enabled: false, url: "https://www.inc.com/rss"}

  # --- .NET, yazılım ve çapraz platform ---
  - {name: ".NET Blog", topic: dotnet, url: "https://devblogs.microsoft.com/dotnet/feed/"}
  - {name: "Visual Studio Blog", topic: dotnet, url: "https://devblogs.microsoft.com/visualstudio/feed/"}
  # Morning Dew bir "derleme" yazısıdır: yazının kendisi aday olmaz, içindeki asıl makale
  # bağlantıları (yazar, bölüm bilgisiyle) ayrı aday olur. Madde, asıl sitenin adıyla görünür.
  - name: "Morning Dew"
    topic: dotnet
    roundup: true
    cap: 80
    url: "https://feeds2.feedburner.com/alvinashcraft"
    skip_domains: [alvinashcraft.com]
    # Yalnızca bu bölümler alınır (tam eşleşme, büyük/küçük harf fark etmez). Yazılım konusunun kapsamı bunlardır.
    only_sections:
      - Top Links
      - Database
      - Web and Cloud Development
      - Windows Development
      - ".NET and Visual Studio"
      - AI
      - Python
      - "Design, DevOps and Methodology"
      - Mobile and Game Development
      - Screencasts and Videos
  - {name: "Martin Fowler", topic: dotnet, url: "https://martinfowler.com/feed.atom"}
  - {name: "The GitHub Blog", topic: dotnet, url: "https://github.blog/feed/"}
  - {name: "Hacker News", topic: dotnet, url: "https://news.ycombinator.com/rss"}
  # GitHub Trending (haftalık liste): resmî RSS/API yok, sayfa HTML'i ayrıştırılır (günde 2 istek). Depo adayları "repo" türündedir.
  # Sayfa yapısı değişirse "trending sayfası ayrıştırılamadı" hatası görünür (sessiz kalmaz).
  - {name: "GitHub Trending", topic: dotnet, html: trending, kind: repo, cap: 12, seen_days: 30, url: "https://github.com/trending?since=weekly"}
  - {name: "GitHub Trending: C#", topic: dotnet, enabled: false, html: trending, kind: repo, cap: 8, seen_days: 30, url: "https://github.com/trending/c%23?since=weekly"}
  - {name: "The Practical Developer", topic: dotnet, url: "https://dev.to/feed"}

  # --- Medium (takip ettiğim yayınlar/yazarlar): RSS yalnızca ön izleme verir; maddeler kısa tutulur ---
  # Adresler tahmindir; ilk çalıştırmada log'daki "kaynak okunamadı" satırlarına bakıp düzeltin.
  - {name: "Medium: Trendyol Tech", topic: dotnet, kind: medium, cap: 6, url: "https://medium.com/feed/trendyol-tech"}
  - {name: "Medium: Level Up Coding", topic: dotnet, kind: medium, cap: 10, url: "https://levelup.gitconnected.com/feed"}
  - {name: "Medium: Kodcular", topic: dotnet, kind: medium, cap: 6, url: "https://medium.com/feed/kodcular"}
  - {name: "Medium: Milan Jovanović", topic: dotnet, kind: medium, cap: 5, url: "https://medium.com/feed/@milan_jovanovic"}

  # --- Stack Overflow etiketleri ("MTN_Anlık"): soru-cevap, en fazla max_qa madde ---
  # Her etiketten en fazla 8 aday (cap): sorular adayların çoğunu doldurup blog yazılarını bastırmasın.
  # Etiket başına akış adresi: https://stackoverflow.com/feeds/tag/<etiket>  (ilk çalıştırmada doğrulayın)
  - {name: "Stack Overflow: avalonia", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/avalonia"}
  - {name: "Stack Overflow: avaloniaui", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/avaloniaui"}
  - {name: "Stack Overflow: wpf", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/wpf"}
  - {name: "Stack Overflow: winforms", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/winforms"}
  - {name: "Stack Overflow: entity-framework", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/entity-framework"}
  - {name: "Stack Overflow: visual-studio", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/visual-studio"}
  # Çok genel etiketler: günde yüzlerce yeni soru gelir, varsayılan olarak kapalı.
  - {name: "Stack Overflow: c#", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/c%23"}
  - {name: "Stack Overflow: .net-framework-version", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/.net-framework-version"}
  - {name: "Stack Overflow: user-interface", topic: dotnet, kind: qa, cap: 8, url: "https://stackoverflow.com/feeds/tag/user-interface"}
  - {name: "Stack Overflow: lambda", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/lambda"}
  - {name: "Stack Overflow: version-control", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/version-control"}
  - {name: "Stack Overflow: git-commit", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/git-commit"}

  # --- Savunma, İHA ve insansız sistemler ---
  - {name: "SavunmaSanayiST", topic: savunma, url: "https://www.savunmasanayist.com/feed/"}
  # "Air – Unmanned Systems Technology" bu akışın alt kümesi olduğu için ayrıca eklenmedi.
  # Unmanned Systems Technology: GitHub Actions'tan 403 (bot engeli) döndüğü için kapalı.
  - {name: "Unmanned Systems Technology", topic: savunma, enabled: false, url: "https://www.unmannedsystemstechnology.com/feed/"}

  # Aşağıdaki akışlar, elcuman.github.io/Bulten'in kaynakça bağlantılarından türetilen ADAY akışlardır.
  # Adresler (çoğu WordPress /feed/) bu oturumda doğrulanamadı: ilk çalıştırmadan sonra sayfa altlığındaki
  # "N kaynak okunamadı" uyarısına bakın; okunamayanı kapatın (enabled: false) veya adresini düzeltin.
  - {name: "Air & Space Forces Magazine", topic: savunma, url: "https://www.airandspaceforces.com/feed/"}
  - {name: "Soldier Systems Daily", topic: savunma, url: "https://soldiersystems.net/feed/"}
  - {name: "Naval News", topic: savunma, url: "https://www.navalnews.com/feed/"}
  - {name: "European Security & Defence", topic: savunma, url: "https://euro-sd.com/feed/"}
  - {name: "Defence Industry Europe", topic: savunma, url: "https://defence-industry.eu/feed/"}
  - {name: "UAS Weekly", topic: savunma, url: "https://uasweekly.com/feed/"}
  - {name: "UAS Vision", topic: savunma, url: "https://www.uasvision.com/feed/"}
  # Bülten'in 19 Kasım kaynakçasından eklenenler (adresler doğrulanmadı; ilk çalıştırma log'una bakın).
  # Kapalı: The Defense Post (akış XML'i bozuk), Military & Aerospace Electronics (404, adres bulunamadı).
  - {name: "Breaking Defense", topic: savunma, url: "https://breakingdefense.com/feed/"}
  - {name: "The War Zone", topic: savunma, url: "https://www.twz.com/feed"}
  - {name: "Defense News", topic: savunma, url: "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml"}
  - {name: "DefenseScoop", topic: savunma, url: "https://defensescoop.com/feed/"}
  - {name: "The Defense Post", topic: savunma, enabled: false, url: "https://thedefensepost.com/feed/"}
  - {name: "DroneXL", topic: savunma, url: "https://dronexl.co/feed/"}
  - {name: "DroneLife", topic: savunma, url: "https://dronelife.com/feed/"}
  - {name: "Naval Today", topic: savunma, url: "https://www.navaltoday.com/feed/"}
  - {name: "Military & Aerospace Electronics", topic: savunma, enabled: false, url: "https://www.militaryaerospace.com/rss"}
  - {name: "Euromaidan Press", topic: savunma, url: "https://euromaidanpress.com/feed/"}
  - {name: "Quwa (Türk savunma)", topic: savunma, enabled: false, url: "https://quwa.org/feed/"}
  # Derleme bültenleri: yazının kendisi değil, içindeki makale bağlantıları aday olur.
  - name: "Defense Tech Daily"
    topic: savunma
    roundup: true
    min_links: 1   # metin ağırlıklı bülten: yazı başına yalnızca 1-3 dış bağlantı var
    cap: 30
    url: "https://buttondown.com/defensetech/rss"
  # Quwa ve 5Side GitHub Actions'tan 403 (bot engeli) verdiği için kapalı.
  - name: "5Side Dual-Use Digest"
    topic: savunma
    enabled: false
    roundup: true
    min_links: 3
    cap: 30
    url: "https://5sidestrategy.substack.com/feed"

# --- Sonraki dalga (şimdilik kapalı): bilim, teknoloji ve gündem kaynakları ---
# Konu eklemek için: topics altına yeni bir blok açın, buraya akışlarını yazın.
