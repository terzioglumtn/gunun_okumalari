# Günün Okumaları — yapılandırma
# Akışları eklemek/çıkarmak için yalnızca bu dosyayı düzenleyin.

site:
  title: "Günün Okumaları"
  subtitle: "Her sabah, seçilmiş kaynaklardan Türkçe okuma listesi"
  base_url: "https://terzioglumtn.github.io/gunun_okumalari/"
  timezone: "Europe/Istanbul"

run:
  lookback_hours: 48        # kaçırılan bir gün olursa öğe kaybolmasın diye geniş tutulur
  seen_days: 7              # son 7 günde yayınlanan bağlantılar tekrar seçilmez
  per_feed_cap: 20          # bir akıştan en fazla bu kadar yeni öğe adaya girer
  candidates_per_topic: 160 # LLM'e giden aday üst sınırı (maliyeti sınırlar)
  top_n: 3                  # "Önce bunlar" bölümü (minimum sürüm)
  max_qa: 3                 # soru-cevap (Stack Overflow) türünden en fazla kaç madde
  max_feed_failure_ratio: 0.5   # akışların yarısından fazlası okunamazsa iş başarısız olur (uyarı e-postası)

llm:
  # backend: ortam değişkeni LLM_BACKEND ile de verilebilir.
  #   claude_cli    -> Claude Code, abonelik token'ı (CLAUDE_CODE_OAUTH_TOKEN)
  #   anthropic_api -> Anthropic API (ANTHROPIC_API_KEY)
  #   mock          -> LLM çağırmaz, hattı ücretsiz sınamak içindir
  backend: claude_cli
  select_model: claude-haiku-5-5      # eleme aşaması: ucuz model yeterli
  summarize_model: claude-sonnet-5-5  # özetleme aşaması

topics:
  dotnet:
    title: ".NET, yazılım ve çapraz platform"
    desc: ".NET, C#, WPF/WinForms, Avalonia, Visual Studio, yazılım mimarisi, Git, geliştirici araçları ve yapay zekâ destekli geliştirme"
    max_items: 7
  savunma:
    title: "Savunma, İHA ve insansız sistemler"
    desc: "İHA/SİHA, insansız sistemler, otonomi, İHA karşıtı sistemler, savunma sanayii programları ve ihracat gelişmeleri"
    max_items: 7

feeds:
  # --- .NET, yazılım ve çapraz platform ---
  - {name: ".NET Blog", topic: dotnet, url: "https://devblogs.microsoft.com/dotnet/feed/"}
  - {name: "Visual Studio Blog", topic: dotnet, url: "https://devblogs.microsoft.com/visualstudio/feed/"}
  # Morning Dew bir "derleme" yazısıdır: yazının kendisi aday olmaz, içindeki asıl makale
  # bağlantıları (yazar, bölüm bilgisiyle) ayrı aday olur. Madde, asıl sitenin adıyla görünür.
  - name: "Morning Dew"
    topic: dotnet
    roundup: true
    cap: 80
    url: "https://feeds2.feedburner.com/alvinashcraft"
    skip_domains: [alvinashcraft.com]
    # Makale olmayan bölümler (sponsorlu kurs, podcast, video, başka derlemeler)
    skip_sections: [Dometrain, Podcasts, Screencasts, More Link Collections]
  - {name: "Martin Fowler", topic: dotnet, url: "https://martinfowler.com/feed.atom"}
  - {name: "The GitHub Blog", topic: dotnet, url: "https://github.blog/feed/"}
  - {name: "Hacker News", topic: dotnet, url: "https://news.ycombinator.com/rss"}
  - {name: "The Practical Developer", topic: dotnet, url: "https://dev.to/feed"}

  # --- Stack Overflow etiketleri ("MTN_Anlık"): soru-cevap, en fazla max_qa madde ---
  # Etiket başına akış adresi: https://stackoverflow.com/feeds/tag/<etiket>  (ilk çalıştırmada doğrulayın)
  - {name: "Stack Overflow: avalonia", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/avalonia"}
  - {name: "Stack Overflow: avaloniaui", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/avaloniaui"}
  - {name: "Stack Overflow: wpf", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/wpf"}
  - {name: "Stack Overflow: winforms", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/winforms"}
  - {name: "Stack Overflow: entity-framework", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/entity-framework"}
  - {name: "Stack Overflow: visual-studio", topic: dotnet, kind: qa, url: "https://stackoverflow.com/feeds/tag/visual-studio"}
  # Çok genel etiketler: günde yüzlerce yeni soru gelir, varsayılan olarak kapalı.
  - {name: "Stack Overflow: c#", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/c%23"}
  - {name: "Stack Overflow: .net-framework-version", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/.net-framework-version"}
  - {name: "Stack Overflow: user-interface", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/user-interface"}
  - {name: "Stack Overflow: lambda", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/lambda"}
  - {name: "Stack Overflow: version-control", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/version-control"}
  - {name: "Stack Overflow: git-commit", topic: dotnet, kind: qa, enabled: false, url: "https://stackoverflow.com/feeds/tag/git-commit"}

  # --- Savunma, İHA ve insansız sistemler ---
  - {name: "SavunmaSanayiST", topic: savunma, url: "https://www.savunmasanayist.com/feed/"}
  # "Air – Unmanned Systems Technology" bu akışın alt kümesi olduğu için ayrıca eklenmedi.
  # Unmanned Systems Technology: GitHub Actions'tan 403 (bot engeli) döndüğü için kapalı.
  - {name: "Unmanned Systems Technology", topic: savunma, enabled: false, url: "https://www.unmannedsystemstechnology.com/feed/"}

  # Aşağıdaki akışlar, elcuman.github.io/Bulten'in kaynakça bağlantılarından türetilen ADAY akışlardır.
  # Adresler (çoğu WordPress /feed/) bu oturumda doğrulanamadı: ilk çalıştırmadan sonra sayfa altlığındaki
  # "N kaynak okunamadı" uyarısına bakın; okunamayanı kapatın (enabled: false) veya adresini düzeltin.
  - {name: "Air & Space Forces Magazine", topic: savunma, url: "https://www.airandspaceforces.com/feed/"}
  - {name: "Soldier Systems Daily", topic: savunma, url: "https://soldiersystems.net/feed/"}
  - {name: "Naval News", topic: savunma, url: "https://www.navalnews.com/feed/"}
  - {name: "European Security & Defence", topic: savunma, url: "https://euro-sd.com/feed/"}
  - {name: "Defence Industry Europe", topic: savunma, url: "https://defence-industry.eu/feed/"}
  - {name: "UAS Weekly", topic: savunma, url: "https://uasweekly.com/feed/"}
  - {name: "UAS Vision", topic: savunma, url: "https://www.uasvision.com/feed/"}
  # Bülten'in 19 Kasım kaynakçasından eklenenler (adresler doğrulanmadı; ilk çalıştırma log'una bakın).
  - {name: "Breaking Defense", topic: savunma, url: "https://breakingdefense.com/feed/"}
  - {name: "The War Zone", topic: savunma, url: "https://www.twz.com/feed"}
  - {name: "Defense News", topic: savunma, url: "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml"}
  - {name: "DefenseScoop", topic: savunma, url: "https://defensescoop.com/feed/"}
  - {name: "The Defense Post", topic: savunma, url: "https://thedefensepost.com/feed/"}
  - {name: "DroneXL", topic: savunma, url: "https://dronexl.co/feed/"}
  - {name: "DroneLife", topic: savunma, url: "https://dronelife.com/feed/"}
  - {name: "Naval Today", topic: savunma, url: "https://www.navaltoday.com/feed/"}
  - {name: "Military & Aerospace Electronics", topic: savunma, url: "https://www.militaryaerospace.com/rss"}
  - {name: "Euromaidan Press", topic: savunma, url: "https://euromaidanpress.com/feed/"}
  - {name: "Quwa (Türk savunma)", topic: savunma, enabled: false, url: "https://quwa.org/feed/"}
  # Derleme bültenleri: yazının kendisi değil, içindeki makale bağlantıları aday olur.
  - name: "Defense Tech Daily"
    topic: savunma
    roundup: true
    min_links: 1   # metin ağırlıklı bülten: yazı başına yalnızca 1-3 dış bağlantı var
    cap: 30
    url: "https://buttondown.com/defensetech/rss"
  # Quwa ve 5Side GitHub Actions'tan 403 (bot engeli) verdiği için kapalı.
  - name: "5Side Dual-Use Digest"
    topic: savunma
    enabled: false
    roundup: true
    min_links: 3
    cap: 30
    url: "https://5sidestrategy.substack.com/feed"

# --- Sonraki dalga (şimdilik kapalı): bilim, teknoloji ve gündem kaynakları ---
# Konu eklemek için: topics altına yeni bir blok açın, buraya akışlarını yazın.
